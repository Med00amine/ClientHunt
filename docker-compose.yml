services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clienthunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clienthunt
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clienthunt"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clienthunt:${POSTGRES_PASSWORD}@db:5432/clienthunt
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      EXPORTS_DIR: /srv/app/exports
      BACKUPS_DIR: /srv/app/backups
      PORTFOLIO_PATH: /srv/app/data/portfolio.json
      FRONTEND_DIST: /srv/app/frontend/dist
    ports: ["127.0.0.1:8080:8000"]   # local only; put a TLS reverse proxy in front before exposing
    volumes:
      - ./exports:/srv/app/exports
      - ./backups:/srv/app/backups
      - ./data:/srv/app/data
    restart: unless-stopped
volumes:
  pgdata:
